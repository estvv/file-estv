services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: transfer-backend-estv
    expose:
      - "8080"
    networks:
      - caddy_net
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - PORT=8080
      - MAX_FILE_SIZE=52428800
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: transfer-frontend-estv
    expose:
      - "80"
    networks:
      - caddy_net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  caddy_net:
    external: true